# nadolabs-site 저장소의 .github/workflows/pages.yml (원본: 지금약국 저장소 tool/web/nadolabs-site-pages.yml)
# 사이트를 GitHub Actions 로 배포한다. 지역별 약국 페이지(/pharmnow/…)는 배포할 때마다 공개 데이터로 새로 만들고
# 리포에는 커밋하지 않는다(매일 수백 개 파일을 커밋하면 리포가 해마다 1GB 가까이 커진다).
# 필요: 리포 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 19 * * *" # UTC 19:07 = KST 04:07 (데이터 수집 03:17 KST 뒤)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 사이트 모으기 + 지역별 약국 페이지 생성
        run: |
          mkdir -p _site
          # 손으로 만든 파일(회사 소개, app-ads.txt, 개인정보처리방침 등)
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' --exclude '_site' ./ _site/
          python tools/build_web.py --fetch --out _site/pharmnow
          test -f _site/pharmnow/privacy.html
          test -f _site/app-ads.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
